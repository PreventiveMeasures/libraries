name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  # The packages' tests in two jobs side by side, each of about half the
  # CPU of them all, which one runner no longer does in its two minutes:
  # rn's, and the others'.
  packages:
    name: test (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: rn
            filter: ./rn
          - part: others
            filter: '!./rn'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
        with:
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm i --frozen-lockfile
      - run: pnpm -r --no-sort --filter '${{ matrix.filter }}' run test

  # The check of all the tests, as before: passed where both jobs did, and
  # failed where either failed or was cancelled.
  test:
    needs: packages
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test '${{ needs.packages.result }}' = success
