allowBuilds:
  esbuild: false

autoInstallPeers: false

enableGlobalVirtualStore: false

linkWorkspacePackages: true

lockfileIncludeTarballUrl: true

minimumReleaseAgeExclude:
  - "@chalker/*"
  - "@preventive/*"
  - "@rray/*"

packages:
  - "ai"
  - "diff"
  - "archive"
  - "lockfile"
  - "upstream"
  - "vfs"
  - "yaml"

preferWorkspacePackages: true
